# Cloud Build: test -> build -> push to Artifact Registry -> deploy to Cloud Run.
# gcloud builds submit --config cloudbuild.yaml --region=europe-west2
substitutions:
  _REGION: europe-west2
  _SERVICE: neurobridge-api
  _REPO: neurobridge

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r backend/requirements.txt && python -m pytest backend/tests -q -p no:cacheprovider"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      # Env/secrets/service account were set by deploy/gcp-setup.ps1 and persist across revisions.

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
